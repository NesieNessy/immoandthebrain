# Supabase local development configuration
project_id = "immoandthebrain"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# supabase/seed.sql is stale (references a "properties" table with columns
# that don't match the current property schema) and would hard-error
# `supabase db reset`'s default seed step. Disabled rather than fixed here —
# e2e fixture data is seeded separately by apps/web/e2e/fixtures/seed.ts,
# which targets the current schema directly.
[db.seed]
enabled = false

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54324

[local_smtp]
enabled = true
port = 54325
smtp_port = 54326
pop3_port = 54327

[storage]
enabled = true
file_size_limit = "50MiB"

# Disabled: the CLI's default analytics (Logflare) port collides with
# local_smtp.pop3_port above (both default/land on 54327), which made
# `supabase start` fail with "port is already allocated" on
# supabase_inbucket — confirmed via `docker events` that
# supabase_analytics grabs 54327 first, and its own health check was
# failing regardless. Nothing in this app or the e2e suite reads Studio's
# log explorer, so there's no functional loss.
[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
